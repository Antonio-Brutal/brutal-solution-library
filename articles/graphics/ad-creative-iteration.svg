<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Engineering schematic: a constrained brand plate holding a claim rack fans candidate strands into a variant matrix of outlined cells, the matrix converges on a lime-ringed brand owner approves node, then launch nozzles emit ribbons whose returns are gathered on a measurement bar and carried back along a feedback rail beneath the whole diagram into the plate">
  <defs>
    <radialGradient id="ad-creative-iteration-vig" cx="50%" cy="44%" r="78%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020618"/>
    </radialGradient>
    <filter id="ad-creative-iteration-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="ad-creative-iteration-glowBig" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="ad-creative-iteration-pulse">
      <circle r="5" fill="#bbf451" opacity="0.85" filter="url(#ad-creative-iteration-glow)"/>
      <circle r="1.8" fill="#d8f999"/>
    </g>
    <g id="ad-creative-iteration-pulseDeep">
      <circle r="6" fill="#9de500" opacity="0.85" filter="url(#ad-creative-iteration-glow)"/>
      <circle r="2.2" fill="#d8f999"/>
    </g>
    <g id="ad-creative-iteration-swoosh">
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451" filter="url(#ad-creative-iteration-glow)" opacity="0.7"/>
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#ad-creative-iteration-vig)"/>

  <!-- brand rules entering the constraint plate -->
  <g stroke="#f8fafc" fill="none" stroke-width="1" opacity="0.55">
    <path d="M-10,252 C24,252 46,260 78,264"/>
    <path d="M-10,300 C24,300 46,300 78,300"/>
    <path d="M-10,348 C24,348 46,340 78,336"/>
  </g>

  <!-- constraint plate: the one isometric enclosure, holding the claim rack -->
  <g stroke="#f8fafc" fill="none">
    <rect x="78" y="236" width="122" height="168" stroke-width="1.3"/>
    <path d="M78,236 L106,212 L228,212 L200,236 Z" stroke-width="1.3"/>
    <path d="M200,236 L228,212 L228,380 L200,404 Z" stroke-width="1.3"/>
    <g stroke-width="1" opacity="0.32">
      <path d="M206,398 L224,382"/>
      <path d="M206,374 L224,358"/>
      <path d="M206,350 L224,334"/>
    </g>
  </g>
  <g stroke="#f8fafc" stroke-width="1" opacity="0.7">
    <line x1="92" y1="262" x2="186" y2="262"/>
    <line x1="92" y1="288" x2="170" y2="288"/>
    <line x1="92" y1="314" x2="186" y2="314"/>
    <line x1="92" y1="340" x2="158" y2="340"/>
    <line x1="92" y1="366" x2="186" y2="366"/>
  </g>
  <line x1="162" y1="334" x2="162" y2="346" stroke="#90a1b9" stroke-width="1.4"/>

  <!-- candidate strands fanning out of the plate -->
  <g stroke="#f8fafc" fill="none" stroke-width="1">
    <path d="M228,296 C270,290 292,206 330,206" opacity="0.5"/>
    <path d="M228,297 C272,294 294,238 330,238" opacity="0.8"/>
    <path d="M228,299 C274,298 296,266 330,266" opacity="0.6"/>
    <path d="M228,300 C276,300 300,296 330,296" opacity="0.85"/>
    <path d="M228,301 C276,302 300,306 330,310" opacity="0.6"/>
    <path d="M228,302 C274,304 296,340 330,340" opacity="0.85"/>
    <path d="M228,304 C270,310 292,400 330,400" opacity="0.7"/>
  </g>
  <use href="#ad-creative-iteration-pulse" x="272" y="246"/>
  <use href="#ad-creative-iteration-pulse" x="292" y="299"/>
  <use href="#ad-creative-iteration-pulse" x="278" y="352"/>
  <use href="#ad-creative-iteration-pulse" x="304" y="386"/>

  <!-- variant matrix -->
  <g stroke="#f8fafc" fill="none" stroke-width="1" opacity="0.72">
    <rect x="330" y="196" width="46" height="44"/>
    <rect x="386" y="196" width="46" height="44"/>
    <rect x="442" y="196" width="46" height="44"/>
    <rect x="554" y="196" width="46" height="44"/>
    <rect x="330" y="250" width="46" height="44"/>
    <rect x="386" y="250" width="46" height="44"/>
    <rect x="442" y="250" width="46" height="44"/>
    <rect x="498" y="250" width="46" height="44"/>
    <rect x="554" y="250" width="46" height="44"/>
    <rect x="330" y="304" width="46" height="44"/>
    <rect x="386" y="304" width="46" height="44"/>
    <rect x="442" y="304" width="46" height="44"/>
    <rect x="498" y="304" width="46" height="44"/>
    <rect x="554" y="304" width="46" height="44"/>
    <rect x="386" y="358" width="46" height="44"/>
    <rect x="442" y="358" width="46" height="44"/>
    <rect x="498" y="358" width="46" height="44"/>
    <rect x="554" y="358" width="46" height="44"/>
  </g>
  <g stroke="#90a1b9" fill="none" stroke-width="1" opacity="0.55" stroke-dasharray="3 4">
    <rect x="498" y="196" width="46" height="44"/>
    <rect x="330" y="358" width="46" height="44"/>
  </g>
  <g stroke="#90a1b9" stroke-width="1" opacity="0.85">
    <line x1="353" y1="180" x2="353" y2="190"/>
    <line x1="409" y1="180" x2="409" y2="190"/>
    <line x1="465" y1="180" x2="465" y2="190"/>
    <line x1="521" y1="180" x2="521" y2="190"/>
    <line x1="577" y1="180" x2="577" y2="190"/>
    <line x1="314" y1="218" x2="324" y2="218"/>
    <line x1="314" y1="272" x2="324" y2="272"/>
    <line x1="314" y1="326" x2="324" y2="326"/>
    <line x1="314" y1="380" x2="324" y2="380"/>
  </g>
  <g stroke="#f8fafc" stroke-width="1" opacity="0.4">
    <line x1="394" y1="212" x2="424" y2="212"/>
    <line x1="506" y1="266" x2="536" y2="266"/>
    <line x1="338" y1="320" x2="368" y2="320"/>
  </g>
  <use href="#ad-creative-iteration-pulse" x="353" y="218"/>
  <use href="#ad-creative-iteration-pulse" x="465" y="218"/>
  <use href="#ad-creative-iteration-pulse" x="409" y="272"/>
  <use href="#ad-creative-iteration-pulse" x="577" y="272"/>
  <use href="#ad-creative-iteration-pulse" x="465" y="326"/>
  <use href="#ad-creative-iteration-pulse" x="521" y="380"/>

  <!-- matrix converges on the approval throat -->
  <g stroke="#f8fafc" fill="none" stroke-width="1" opacity="0.85">
    <path d="M600,218 C640,218 652,286 680,296"/>
    <path d="M600,272 C640,272 656,292 680,299"/>
    <path d="M600,326 C640,326 656,304 680,302"/>
    <path d="M600,380 C640,380 652,314 680,305"/>
    <line x1="680" y1="300" x2="692" y2="300" stroke-width="1.3"/>
  </g>

  <!-- brand owner decision node -->
  <circle cx="716" cy="300" r="20" fill="#bbf451" opacity="0.45" filter="url(#ad-creative-iteration-glowBig)"/>
  <circle cx="716" cy="300" r="24" fill="none" stroke="#bbf451" stroke-width="1.5"/>
  <circle cx="716" cy="300" r="15" fill="#050608" stroke="#f8fafc" stroke-width="1"/>
  <path d="M709,300 L715,306 L725,292" fill="none" stroke="#f8fafc" stroke-width="1.2"/>

  <!-- launch manifold and nozzles -->
  <g stroke="#f8fafc" fill="none" stroke-width="1">
    <line x1="740" y1="300" x2="768" y2="300" stroke-width="1.3"/>
    <path d="M768,300 C792,300 800,224 820,224"/>
    <path d="M768,300 C794,300 802,274 820,274"/>
    <path d="M768,300 C794,300 802,326 820,326"/>
    <path d="M768,300 C792,300 800,376 820,376"/>
    <path d="M820,218 L846,224 L820,230 Z" stroke-width="1.1"/>
    <path d="M820,268 L846,274 L820,280 Z" stroke-width="1.1"/>
    <path d="M820,320 L846,326 L820,332 Z" stroke-width="1.1"/>
    <path d="M820,370 L846,376 L820,382 Z" stroke-width="1.1"/>
    <line x1="846" y1="224" x2="932" y2="224" opacity="0.85"/>
    <line x1="846" y1="274" x2="932" y2="274" opacity="0.85"/>
    <line x1="846" y1="326" x2="932" y2="326" opacity="0.85"/>
    <line x1="846" y1="376" x2="932" y2="376" opacity="0.85"/>
  </g>
  <use href="#ad-creative-iteration-pulse" x="876" y="224"/>
  <use href="#ad-creative-iteration-pulse" x="906" y="274"/>
  <use href="#ad-creative-iteration-pulse" x="890" y="326"/>

  <!-- returns gathered on the measurement bar -->
  <g stroke="#f8fafc" fill="none" stroke-width="1" opacity="0.7">
    <path d="M932,224 C980,224 1004,198 1030,196"/>
    <path d="M932,274 C984,274 1008,264 1030,262"/>
    <path d="M932,326 C984,326 1008,336 1030,338"/>
    <path d="M932,376 C980,376 1004,402 1030,404"/>
  </g>
  <g stroke="#f8fafc" fill="none">
    <line x1="1040" y1="170" x2="1040" y2="460" stroke-width="1.3"/>
    <line x1="1048" y1="178" x2="1048" y2="452" stroke-width="1" opacity="0.4"/>
    <g stroke-width="1" opacity="0.75">
      <line x1="1030" y1="196" x2="1040" y2="196"/>
      <line x1="1030" y1="240" x2="1040" y2="240"/>
      <line x1="1030" y1="262" x2="1040" y2="262"/>
      <line x1="1030" y1="338" x2="1040" y2="338"/>
      <line x1="1030" y1="404" x2="1040" y2="404"/>
    </g>
    <g stroke-width="1" opacity="0.55">
      <path d="M1052,182 L1060,182 L1060,266 L1052,266"/>
      <path d="M1052,278 L1060,278 L1060,352 L1052,352"/>
      <path d="M1052,364 L1060,364 L1060,450 L1052,450"/>
      <line x1="1060" y1="224" x2="1082" y2="224"/>
      <line x1="1060" y1="315" x2="1082" y2="315"/>
      <line x1="1060" y1="407" x2="1082" y2="407"/>
      <line x1="1082" y1="224" x2="1082" y2="407"/>
    </g>
  </g>
  <use href="#ad-creative-iteration-pulse" x="1030" y="196"/>
  <use href="#ad-creative-iteration-pulse" x="1030" y="262"/>
  <use href="#ad-creative-iteration-pulse" x="1030" y="404"/>

  <!-- feedback rail: the only line running right to left -->
  <path d="M1082,407 C1082,478 1050,534 986,542 L232,542 C168,542 126,506 118,430" fill="none" stroke="#f8fafc" stroke-width="1.2" opacity="0.9"/>
  <use href="#ad-creative-iteration-pulseDeep" x="900" y="542"/>
  <use href="#ad-creative-iteration-pulseDeep" x="700" y="542"/>
  <use href="#ad-creative-iteration-pulseDeep" x="420" y="542"/>
  <use href="#ad-creative-iteration-swoosh" x="560" y="542" transform="rotate(180 560 542)"/>

  <!-- tie-lines -->
  <g stroke="#62748e" stroke-width="1" stroke-dasharray="2 5" opacity="0.45">
    <path d="M139,420 V466"/>
    <path d="M465,414 V466"/>
    <path d="M866,392 V466"/>
    <path d="M716,330 V382"/>
  </g>

  <g font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif">
    <text x="139" y="486" font-size="20" fill="#f8fafc" text-anchor="middle">constraints</text>
    <text x="465" y="486" font-size="20" fill="#f8fafc" text-anchor="middle">variant matrix</text>
    <text x="866" y="486" font-size="20" fill="#f8fafc" text-anchor="middle">launch</text>
    <text x="716" y="400" font-size="18" fill="#90a1b9" text-anchor="middle">brand owner approves</text>
    <text x="1094" y="146" font-size="18" fill="#90a1b9" text-anchor="middle">performance</text>
    <text x="560" y="580" font-size="18" fill="#90a1b9" text-anchor="middle">what won, fed back</text>
  </g>
</svg>
