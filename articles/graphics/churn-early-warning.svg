    </filter>
    <g id="churn-early-warning-pulse">
      <circle r="5.5" fill="#bbf451" opacity="0.8" filter="url(#churn-early-warning-glow)"/>
      <circle r="2" fill="#d8f999"/>
    </g>
    <g id="churn-early-warning-pulseDeep">
      <circle r="6.5" fill="#9de500" opacity="0.85" filter="url(#churn-early-warning-glow)"/>
      <circle r="2.4" fill="#d8f999"/>
