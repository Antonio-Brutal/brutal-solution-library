<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" role="img" aria-label="Schematic of a churn early-warning engine: subscriber timelines are tapped by two combs into a split collector rail, a triangulated lattice turns signal into six reason-coded exits of unequal width, one ending in a deliberate stub; a lime-ringed policy bar caps every channel and a permanent holdout loop runs back against the flow">  <defs>
