    <path d="M 618 508 h 18" opacity="0.45"/>
  </g>
  <use xlink:href="#pulseDeep" transform="translate(552,466)"/>

  <!-- wires into context assembly -->
  <g stroke="#f8fafc" fill="none" stroke-width="1" opacity="0.85">
    <path d="M 560 285 C 585 285, 592 292, 615 292"/>
    <path d="M 560 320 L 615 320"/>
    <path d="M 560 355 C 585 355, 592 348, 615 348"/>
  </g>

  <!-- context assembly: isometric enclosure with mesh + context taps -->
  <g stroke="#f8fafc" fill="none">
    <rect x="615" y="262" width="150" height="126" stroke-width="1.3"/>
    <path d="M 615 262 L 645 234 L 795 234 L 765 262 Z" stroke-width="1.3"/>
    <path d="M 765 262 L 795 234 L 795 360 L 765 388 Z" stroke-width="1.3"/>
    <path d="M 771 380 L 789 364" stroke-width="1" opacity="0.3"/>
    <path d="M 771 356 L 789 340" stroke-width="1" opacity="0.3"/>
    <path d="M 771 332 L 789 316" stroke-width="1" opacity="0.3"/>
  </g>
  <g stroke="#f8fafc" opacity="0.45" stroke-width="1" fill="none">
    <path d="M 645 290 L 690 300"/><path d="M 645 290 L 690 345"/>
    <path d="M 645 325 L 690 300"/><path d="M 645 325 L 690 345"/>
    <path d="M 645 360 L 690 300"/><path d="M 645 360 L 690 345"/>
    <path d="M 690 300 L 735 290"/><path d="M 690 300 L 735 325"/>
    <path d="M 690 345 L 735 325"/><path d="M 690 345 L 735 360"/>
    <path d="M 690 300 L 735 360"/><path d="M 690 345 L 735 290"/>
  </g>
  <g fill="#f8fafc" stroke="none">
    <circle cx="645" cy="290" r="3" opacity="0.85"/><circle cx="645" cy="325" r="3" opacity="0.85"/>
    <circle cx="645" cy="360" r="3" opacity="0.85"/><circle cx="690" cy="300" r="3" opacity="0.85"/>
    <circle cx="690" cy="345" r="3" opacity="0.85"/><circle cx="735" cy="290" r="3" opacity="0.85"/>
    <circle cx="735" cy="325" r="3" opacity="0.85"/><circle cx="735" cy="360" r="3" opacity="0.85"/>
    <circle cx="615" cy="292" r="2" opacity="0.6"/><circle cx="615" cy="320" r="2" opacity="0.6"/>
    <circle cx="615" cy="348" r="2" opacity="0.6"/>
  </g>
  <!-- taps: order status / subscription state / past tickets feeding in from above -->
  <g stroke="#f8fafc" fill="none" stroke-width="1">
    <path d="M 648 176 h 24" opacity="0.7"/><path d="M 660 176 V 248" opacity="0.6"/>
    <ellipse cx="660" cy="250" rx="5" ry="2.5" opacity="0.6"/>
    <path d="M 688 168 h 24" opacity="0.7"/><path d="M 700 168 V 242" opacity="0.6"/>
    <ellipse cx="700" cy="244" rx="5" ry="2.5" opacity="0.6"/>
    <path d="M 728 176 h 24" opacity="0.7"/><path d="M 740 176 V 248" opacity="0.6"/>
    <ellipse cx="740" cy="250" rx="5" ry="2.5" opacity="0.6"/>
  </g>
  <use xlink:href="#pulse" transform="translate(700,205)"/>

  <!-- drafting: comb plates, tone plate, nib -->
  <g stroke="#f8fafc" fill="none" stroke-width="1">
    <path d="M 795 300 C 815 300, 818 310, 838 314" opacity="0.85"/>
    <path d="M 795 322 L 838 320" opacity="0.85"/>
    <path d="M 795 344 C 815 344, 818 334, 838 326" opacity="0.85"/>
    <path d="M 838 308 h 30" opacity="0.6"/><path d="M 838 314 h 30" opacity="0.6"/>
    <path d="M 838 320 h 30" opacity="0.6"/><path d="M 838 326 h 30" opacity="0.6"/>
    <path d="M 838 332 h 30" opacity="0.6"/>
    <path d="M 872 302 L 916 320 L 872 338 Z" stroke-width="1.2"/>
    <path d="M 872 320 L 906 320" opacity="0.5"/>
    <rect x="856" y="196" width="64" height="40" rx="2" opacity="0.8"/>
    <path d="M 864 208 h 40" opacity="0.55"/><path d="M 864 218 h 48" opacity="0.55"/>
    <path d="M 864 228 h 28" opacity="0.55"/>
    <path d="M 888 236 V 300" opacity="0.6"/>
    <path d="M 883 266 L 888 274 L 893 266" opacity="0.7"/>
    <path d="M 916 320 L 972 320" stroke-width="1.2"/>
