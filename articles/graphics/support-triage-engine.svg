  <!-- ingestion funnel -->
  <g stroke="#f8fafc" fill="none">
    <ellipse cx="298" cy="320" rx="8" ry="56" stroke-width="1.2" opacity="0.75"/>
    <path d="M 298 264 C 330 272, 352 296, 362 312" stroke-width="1.3"/>
    <path d="M 298 376 C 330 368, 352 344, 362 328" stroke-width="1.3"/>
    <path d="M 302 286 C 328 292, 344 302, 356 314" stroke-width="1" opacity="0.4"/>
    <path d="M 302 354 C 328 348, 344 338, 356 326" stroke-width="1" opacity="0.4"/>
    <ellipse cx="364" cy="320" rx="3.5" ry="9" stroke-width="1.1" opacity="0.85"/>
    <ellipse cx="372" cy="320" rx="3" ry="7.5" stroke-width="1" opacity="0.6"/>
    <path d="M 374 320 L 420 320" stroke-width="1.3"/>
  </g>

  <!-- intent routing: gate cluster -->
  <g stroke="#f8fafc" fill="none">
    <rect x="420" y="252" width="140" height="136" rx="3" stroke-width="1" opacity="0.55"/>
    <path d="M 420 320 L 438 320" stroke-width="1.2"/>
    <circle cx="440" cy="320" r="2.5" fill="#f8fafc" stroke="none" opacity="0.9"/>
    <path d="M 442 318 C 448 300, 450 285, 455 285" stroke-width="1" opacity="0.8"/>
    <path d="M 442 320 L 455 320" stroke-width="1" opacity="0.8"/>
    <path d="M 442 322 C 448 340, 450 355, 455 355" stroke-width="1" opacity="0.8"/>
    <path d="M 455 275 h 13 a 10 10 0 0 1 0 20 h -13 z" stroke-width="1.1"/>
    <path d="M 455 310 h 13 a 10 10 0 0 1 0 20 h -13 z" stroke-width="1.1"/>
    <path d="M 455 345 h 13 a 10 10 0 0 1 0 20 h -13 z" stroke-width="1.1"/>
    <path d="M 479 285 L 497 285" stroke-width="1" opacity="0.7"/>
    <path d="M 479 320 L 497 320" stroke-width="1" opacity="0.7"/>
    <path d="M 479 355 L 497 355" stroke-width="1" opacity="0.7"/>
    <path d="M 504 278 l 7 7 -7 7 -7 -7 z" stroke-width="1.1"/>
    <path d="M 504 313 l 7 7 -7 7 -7 -7 z" stroke-width="1.1"/>
    <path d="M 504 348 l 7 7 -7 7 -7 -7 z" stroke-width="1.1"/>
    <path d="M 511 285 C 530 285, 540 285, 560 285" stroke-width="1" opacity="0.8"/>
    <path d="M 511 320 L 560 320" stroke-width="1" opacity="0.8"/>
    <path d="M 511 355 C 530 355, 540 355, 560 355" stroke-width="1" opacity="0.8"/>
    <circle cx="430" cy="264" r="1.6" fill="#f8fafc" stroke="none" opacity="0.5"/>
    <circle cx="548" cy="264" r="1.6" fill="#f8fafc" stroke="none" opacity="0.5"/>
    <circle cx="430" cy="376" r="1.6" fill="#f8fafc" stroke="none" opacity="0.5"/>
    <path d="M 524 262 h 22" stroke-width="1" opacity="0.35"/>
    <path d="M 434 300 v 14" stroke-width="1" opacity="0.35"/>
  </g>
  <!-- hard-case escalation: dim branch leaving the cluster -->
  <g stroke="#62748e" fill="none" stroke-width="1">
    <path d="M 504 362 C 508 388, 512 392, 516 398 C 540 452, 580 496, 606 506" opacity="0.85"/>
