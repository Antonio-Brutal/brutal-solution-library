  <use xlink:href="#pulse" transform="translate(888,252)"/>

  <!-- human approval: lime-ringed node -->
  <circle cx="1000" cy="320" r="24" fill="none" stroke="#bbf451" stroke-width="1.6" filter="url(#glow)" opacity="0.7"/>
  <circle cx="1000" cy="320" r="24" fill="none" stroke="#bbf451" stroke-width="1.6"/>
  <circle cx="1000" cy="320" r="15" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.75"/>
  <path d="M 992 321 L 998 327 L 1010 312" fill="none" stroke="#d8f999" stroke-width="1.6"/>
  <text x="1000" y="372" text-anchor="middle" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#90a1b9">human approves</text>

  <!-- clean replies out -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.1">
    <path d="M 1026 314 C 1060 306, 1100 304, 1148 304"/>
    <path d="M 1026 320 L 1148 320"/>
    <path d="M 1026 326 C 1060 334, 1100 336, 1148 336"/>
    <path d="M 1148 300 v 8" opacity="0.6"/><path d="M 1148 316 v 8" opacity="0.6"/>
    <path d="M 1148 332 v 8" opacity="0.6"/>
  </g>
  <use xlink:href="#swoosh" transform="translate(1088,320)"/>
  <text x="1104" y="276" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#90a1b9">replies</text>

  <!-- stage labels -->
  <g stroke="#62748e" stroke-width="1" stroke-dasharray="2 5" opacity="0.45">
    <path d="M 490 392 V 545"/>
    <path d="M 703 392 V 545"/>
    <path d="M 902 344 V 545"/>
  </g>
  <g font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#f8fafc" text-anchor="middle">
    <text x="490" y="568">intent routing</text>
    <text x="703" y="568">context assembly</text>
    <text x="902" y="568">drafting</text>
  </g>
</svg>
