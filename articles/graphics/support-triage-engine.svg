<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" role="img" aria-label="Support triage and draft-reply engine schematic">
  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020618"/>
    </radialGradient>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="pulse">
      <circle r="5.5" fill="#bbf451" opacity="0.8" filter="url(#glow)"/>
      <circle r="2" fill="#d8f999"/>
    </g>
    <g id="pulseDeep">
      <circle r="6.5" fill="#9de500" opacity="0.85" filter="url(#glow)"/>
      <circle r="2.4" fill="#d8f999"/>
    </g>
    <g id="swoosh">
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451" filter="url(#glow)" opacity="0.7"/>
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- input strands: tickets in many languages -->
  <g stroke="#f8fafc" fill="none" stroke-width="1">
    <path d="M -10 100 C 100 112, 210 220, 296 288" opacity="0.5"/>
    <path d="M -10 140 C 90 150, 200 240, 296 294" opacity="0.75"/>
    <path d="M -10 180 C 110 176, 205 252, 296 300" opacity="0.45"/>
    <path d="M -10 220 C 95 230, 210 268, 296 306" opacity="0.8"/>
    <path d="M -10 260 C 120 252, 215 288, 296 312" opacity="0.55"/>
    <path d="M -10 300 C 100 310, 200 314, 296 318" opacity="0.85"/>
    <path d="M -10 340 C 110 336, 205 328, 296 324" opacity="0.5"/>
    <path d="M -10 380 C 95 370, 210 342, 296 330" opacity="0.75"/>
    <path d="M -10 420 C 120 428, 215 360, 296 336" opacity="0.45"/>
    <path d="M -10 460 C 100 450, 200 380, 296 342" opacity="0.7"/>
    <path d="M -10 500 C 115 508, 210 402, 296 348" opacity="0.55"/>
    <path d="M -10 540 C 90 528, 205 420, 296 354" opacity="0.65"/>
  </g>
  <use xlink:href="#pulse" transform="translate(96,146)"/>
  <use xlink:href="#pulse" transform="translate(178,232)"/>
  <use xlink:href="#pulse" transform="translate(140,306)"/>
  <use xlink:href="#pulse" transform="translate(226,296)"/>
  <use xlink:href="#pulse" transform="translate(118,442)"/>
  <use xlink:href="#pulse" transform="translate(204,388)"/>
  <use xlink:href="#pulse" transform="translate(84,522)"/>
  <use xlink:href="#pulse" transform="translate(252,338)"/>
  <use xlink:href="#swoosh" transform="translate(240,320) rotate(-2)"/>
