<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Engineering schematic: tangled supplier-feed strands converge through a normalization funnel into an attribute-extraction lattice, then a confidence gate switches items between an auto-publish rail and a human-review siding that rejoins before the live-catalog outputs</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.75" stop-color="#050608"/>
      <stop offset="1" stop-color="#020618"/>
    </radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="pulse">
      <circle r="6.5" fill="#bbf451" opacity="0.85" filter="url(#glow)"/>
      <circle r="2.4" fill="#d8f999"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- chaotic supplier feed strands -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.2">
    <path d="M28,118 C120,100 205,195 300,268" opacity="0.85"/>
    <path d="M34,170 C120,215 205,150 300,281" opacity="0.55"/>
    <path d="M25,218 C135,230 215,262 300,294" opacity="0.9"/>
    <path d="M30,265 C120,285 215,302 300,307" opacity="0.5"/>
    <path d="M26,320 C145,333 225,323 300,320" opacity="0.8"/>
    <path d="M32,374 C140,302 225,400 300,333" opacity="0.6"/>
    <path d="M28,430 C130,432 235,382 300,346" opacity="0.9"/>
    <path d="M35,490 C165,470 245,412 300,359" opacity="0.5"/>
  </g>
  <!-- stray field ticks riding the strands -->
  <g stroke="#f8fafc" stroke-width="1" opacity="0.35">
    <path d="M140,159 v8"/><path d="M212,192 v8"/><path d="M118,222 v8"/>
    <path d="M192,254 v8"/><path d="M158,326 v8"/><path d="M242,312 v8"/>
    <path d="M142,396 v8"/><path d="M222,366 v8"/><path d="M96,264 v8"/>
    <path d="M258,338 v8"/>
  </g>
  <use href="#pulse" x="100" y="122"/>
  <use href="#pulse" x="172" y="232"/>
  <use href="#pulse" x="82" y="322"/>
  <use href="#pulse" x="206" y="352"/>
  <use href="#pulse" x="122" y="424"/>
  <use href="#pulse" x="232" y="296"/>

  <!-- normalization funnel -->
  <g stroke="#f8fafc" fill="none">
    <path d="M300,240 A14,76 0 0 0 300,392" stroke-width="1.2" opacity="0.7"/>
    <path d="M300,240 L392,290" stroke-width="1.4"/>
    <path d="M300,392 L392,342" stroke-width="1.4"/>
    <path d="M300,268 L392,300" stroke-width="1" opacity="0.4"/>
    <path d="M300,364 L392,332" stroke-width="1" opacity="0.4"/>
    <path d="M300,316 L392,316" stroke-width="1" opacity="0.25"/>
    <path d="M392,290 V342" stroke-width="1.2"/>
    <path d="M392,290 C412,300 418,306 430,313" stroke-width="1.2"/>
    <path d="M392,342 C412,332 418,326 430,317" stroke-width="1.2"/>
    <path d="M430,315 H488" stroke-width="1.4"/>
  </g>
  <!-- lime swoosh on the normalized rail -->
  <path d="M438,307 L476,315 L438,323 C446,318 446,312 438,307 Z" fill="#bbf451" opacity="0.8" filter="url(#glow)"/>
  <path d="M444,310 L470,315 L444,320 C449,317 449,313 444,310 Z" fill="#d8f999"/>

  <!-- attribute extraction lattice: isometric enclosure -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.3">
    <path d="M490,238 H670 V392 H490 Z"/>
    <path d="M490,238 L514,218 L694,218 L670,238"/>
    <path d="M670,238 L694,218 V372 L670,392"/>
  </g>
  <g stroke="#f8fafc" fill="none" stroke-width="1">
    <path d="M490,258 H670" opacity="0.22"/>
    <path d="M514,218 H694" opacity="0"/>
  </g>
  <!-- mesh edges -->
  <g stroke="#f8fafc" stroke-width="0.9" opacity="0.3">
    <path d="M528,272 L582,258"/><path d="M528,272 L582,288"/><path d="M528,272 L582,318"/>
    <path d="M528,304 L582,288"/><path d="M528,304 L582,318"/>
    <path d="M528,336 L582,318"/><path d="M528,336 L582,348"/>
    <path d="M528,368 L582,348"/><path d="M528,368 L582,378"/>
    <path d="M582,258 L636,288"/><path d="M582,288 L636,288"/><path d="M582,288 L636,318"/>
    <path d="M582,318 L636,318"/><path d="M582,348 L636,318"/><path d="M582,348 L636,348"/>
    <path d="M582,378 L636,348"/>
  </g>
  <!-- mesh nodes -->
  <g stroke="#f8fafc" stroke-width="1.1" fill="#050608" opacity="0.95">
    <circle cx="528" cy="272" r="5.5"/><circle cx="528" cy="304" r="5.5"/>
    <circle cx="528" cy="336" r="5.5"/><circle cx="528" cy="368" r="5.5"/>
    <circle cx="582" cy="258" r="5.5"/><circle cx="582" cy="288" r="5.5"/>
    <circle cx="582" cy="318" r="5.5"/><circle cx="582" cy="348" r="5.5"/>
    <circle cx="582" cy="378" r="5.5"/>
    <circle cx="636" cy="288" r="5.5"/><circle cx="636" cy="318" r="5.5"/>
    <circle cx="636" cy="348" r="5.5"/>
  </g>
  <path d="M672,315 H744" stroke="#f8fafc" stroke-width="1.4" fill="none"/>
  <use href="#pulse" x="710" y="315"/>

  <!-- confidence gate: switch with threshold dial -->
  <circle cx="752" cy="315" r="6" stroke="#f8fafc" stroke-width="1.2" fill="#050608"/>
  <g stroke="#f8fafc" fill="none">
    <path d="M746,303 L760,315 L746,327" stroke-width="1" opacity="0.6"/>
    <circle cx="773" cy="251" r="11" stroke-width="1" opacity="0.7"/>
    <path d="M773,251 L780,243" stroke-width="1" opacity="0.8"/>
    <path d="M763,247 l-4,-2" stroke-width="1" opacity="0.5"/>
    <path d="M783,247 l4,-2" stroke-width="1" opacity="0.5"/>
    <path d="M770,262 L755,306" stroke-width="1" opacity="0.4" stroke-dasharray="3 4"/>
    <path d="M758,312 C795,306 812,288 838,280 H988" stroke-width="1.4"/>
    <path d="M757,319 C792,330 806,368 826,398 C848,430 872,436 884,436" stroke-width="1.4"/>
  </g>

  <!-- human review siding: lime-ringed node -->
  <circle cx="906" cy="436" r="21" stroke="#bbf451" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#glow)"/>
  <circle cx="906" cy="436" r="21" stroke="#bbf451" stroke-width="1.8" fill="none"/>
  <circle cx="906" cy="436" r="7" stroke="#f8fafc" stroke-width="1.1" fill="#050608"/>
  <path d="M900,436 l4.5,5.5 l8,-11" stroke="#d8f999" stroke-width="1.8" fill="none"/>
  <path d="M927,436 C965,436 992,340 1032,318" stroke="#f8fafc" stroke-width="1.4" fill="none"/>

  <!-- lime swoosh on the auto-publish rail -->
  <path d="M932,272 L966,280 L932,288 C939,283 939,277 932,272 Z" fill="#bbf451" opacity="0.8" filter="url(#glow)"/>
  <path d="M938,275 L962,280 L938,285 C943,282 943,278 938,275 Z" fill="#d8f999"/>

  <!-- output manifold to live catalog -->
  <g stroke="#f8fafc" fill="none">
    <path d="M988,280 C1008,280 1022,300 1040,310" stroke-width="1.4"/>
    <circle cx="1046" cy="314" r="4" stroke-width="1.1" fill="#050608"/>
    <path d="M1050,312 L1086,290" stroke-width="1.2"/>
    <path d="M1050,314 L1086,315" stroke-width="1.2"/>
    <path d="M1050,316 L1086,340" stroke-width="1.2"/>
    <path d="M1046,300 C1062,292 1074,290 1086,288" stroke-width="1" opacity="0.5"/>
    <path d="M1046,328 C1062,336 1074,340 1086,342" stroke-width="1" opacity="0.5"/>
    <path d="M1086,290 H1158" stroke-width="1.3"/>
    <path d="M1086,315 H1158" stroke-width="1.3"/>
    <path d="M1086,340 H1158" stroke-width="1.3"/>
    <path d="M1158,285 V295" stroke-width="1.3"/>
    <path d="M1158,310 V320" stroke-width="1.3"/>
    <path d="M1158,335 V345" stroke-width="1.3"/>
  </g>
  <use href="#pulse" x="1120" y="315"/>

  <!-- labels -->
  <g font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif">
    <text x="36" y="88" font-size="18" fill="#90a1b9">supplier feeds</text>
    <text x="346" y="520" font-size="20" fill="#f8fafc" text-anchor="middle">normalization</text>
    <text x="592" y="520" font-size="20" fill="#f8fafc" text-anchor="middle">attribute extraction</text>
    <text x="780" y="520" font-size="20" fill="#f8fafc" text-anchor="middle">confidence gate</text>
    <text x="906" y="492" font-size="18" fill="#90a1b9" text-anchor="middle">human reviews</text>
    <text x="1160" y="262" font-size="18" fill="#90a1b9" text-anchor="end">live catalog</text>
  </g>
</svg>
