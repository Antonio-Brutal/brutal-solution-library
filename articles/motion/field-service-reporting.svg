<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" role="img" aria-label="Field service voice-to-report schematic: a voice waveform enters a structuring comb that separates it into three rails ending in report, parts, and invoice nozzles; the rails converge on a one-tap confirm node before exiting">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .field-service-reporting-pulse { display: none; }
    }
  </style>

  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020618"/>
    </radialGradient>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="pulse">
      <circle r="5.5" fill="#bbf451" opacity="0.8" filter="url(#glow)"/>
      <circle r="2" fill="#d8f999"/>
    </g>
    <g id="swoosh">
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451" filter="url(#glow)" opacity="0.7"/>
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- voice waveform entering from the left -->
  <g stroke="#f8fafc" stroke-linecap="round">
    <line x1="40" y1="313" x2="40" y2="327" stroke-width="2" opacity="0.5"/>
    <line x1="46" y1="308" x2="46" y2="332" stroke-width="2" opacity="0.6"/>
    <line x1="52" y1="300" x2="52" y2="340" stroke-width="2" opacity="0.7"/>
    <line x1="58" y1="294" x2="58" y2="346" stroke-width="2" opacity="0.8"/>
    <line x1="64" y1="304" x2="64" y2="336" stroke-width="2" opacity="0.6"/>
    <line x1="70" y1="288" x2="70" y2="352" stroke-width="2" opacity="0.85"/>
    <line x1="76" y1="282" x2="76" y2="358" stroke-width="2.2" opacity="0.9"/>
    <line x1="82" y1="298" x2="82" y2="342" stroke-width="2" opacity="0.7"/>
    <line x1="88" y1="309" x2="88" y2="331" stroke-width="2" opacity="0.55"/>
    <line x1="94" y1="316" x2="94" y2="324" stroke-width="2" opacity="0.4"/>
    <line x1="100" y1="317" x2="100" y2="323" stroke-width="2" opacity="0.35"/>
    <line x1="106" y1="313" x2="106" y2="327" stroke-width="2" opacity="0.5"/>
    <line x1="112" y1="303" x2="112" y2="337" stroke-width="2" opacity="0.65"/>
    <line x1="118" y1="290" x2="118" y2="350" stroke-width="2" opacity="0.8"/>
    <line x1="124" y1="278" x2="124" y2="362" stroke-width="2.3" opacity="0.92"/>
    <line x1="130" y1="292" x2="130" y2="348" stroke-width="2" opacity="0.8"/>
    <line x1="136" y1="300" x2="136" y2="340" stroke-width="2" opacity="0.68"/>
    <line x1="142" y1="308" x2="142" y2="332" stroke-width="2" opacity="0.55"/>
    <line x1="148" y1="314" x2="148" y2="326" stroke-width="2" opacity="0.42"/>
    <line x1="154" y1="317" x2="154" y2="323" stroke-width="2" opacity="0.35"/>
    <line x1="160" y1="316" x2="160" y2="324" stroke-width="2" opacity="0.35"/>
    <line x1="166" y1="310" x2="166" y2="330" stroke-width="2" opacity="0.5"/>
    <line x1="172" y1="298" x2="172" y2="342" stroke-width="2" opacity="0.7"/>
    <line x1="178" y1="284" x2="178" y2="356" stroke-width="2.2" opacity="0.88"/>
    <line x1="184" y1="280" x2="184" y2="360" stroke-width="2.2" opacity="0.9"/>
    <line x1="190" y1="296" x2="190" y2="344" stroke-width="2" opacity="0.72"/>
    <line x1="196" y1="306" x2="196" y2="334" stroke-width="2" opacity="0.6"/>
    <line x1="202" y1="312" x2="202" y2="328" stroke-width="2" opacity="0.48"/>
    <line x1="208" y1="317" x2="208" y2="323" stroke-width="2" opacity="0.35"/>
    <line x1="214" y1="315" x2="214" y2="325" stroke-width="2" opacity="0.4"/>
    <line x1="220" y1="307" x2="220" y2="333" stroke-width="2" opacity="0.6"/>
    <line x1="226" y1="295" x2="226" y2="345" stroke-width="2" opacity="0.75"/>
    <line x1="232" y1="286" x2="232" y2="354" stroke-width="2.1" opacity="0.85"/>
    <line x1="238" y1="299" x2="238" y2="341" stroke-width="2" opacity="0.68"/>
    <line x1="244" y1="309" x2="244" y2="331" stroke-width="2" opacity="0.5"/>
    <line x1="250" y1="315" x2="250" y2="325" stroke-width="2" opacity="0.4"/>
    <line x1="256" y1="318" x2="256" y2="322" stroke-width="2" opacity="0.3"/>
  </g>
  <use xlink:href="#pulse" transform="translate(76,282) scale(0.55)"/>
  <use xlink:href="#pulse" transform="translate(124,280) scale(0.55)"/>
  <use xlink:href="#pulse" transform="translate(184,282) scale(0.55)"/>
  <text x="40" y="258" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#90a1b9">voice</text>

  <!-- structuring comb -->
  <path id="field-service-reporting-in" d="M 258 320 L 300 320" stroke="#f8fafc" stroke-width="1.3" fill="none"/>
  <rect x="300" y="260" width="55" height="120" fill="none" stroke="#f8fafc" stroke-width="1.3" opacity="0.85"/>
  <g stroke="#f8fafc" stroke-width="1" opacity="0.5">
    <line x1="312" y1="270" x2="343" y2="270"/>
    <line x1="312" y1="285" x2="343" y2="285"/>
    <line x1="312" y1="300" x2="343" y2="300"/>
    <line x1="312" y1="315" x2="343" y2="315"/>
    <line x1="312" y1="330" x2="343" y2="330"/>
    <line x1="312" y1="345" x2="343" y2="345"/>
    <line x1="312" y1="360" x2="343" y2="360"/>
  </g>
  <g fill="#f8fafc">
    <circle cx="355" cy="280" r="2.5"/>
    <circle cx="355" cy="320" r="2.5"/>
    <circle cx="355" cy="360" r="2.5"/>
  </g>
  <text x="327" y="418" text-anchor="middle" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#f8fafc">structuring</text>
  <path d="M 327 380 V 405" stroke="#62748e" stroke-width="1" stroke-dasharray="2 5" opacity="0.4" fill="none"/>

  <!-- three rails to distinct nozzles -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.1">
    <path id="field-service-reporting-rail1" d="M 355 280 C 480 255, 620 220, 780 210" opacity="0.85"/>
    <path id="field-service-reporting-rail2" d="M 355 320 C 500 320, 640 320, 780 320" opacity="0.85"/>
    <path id="field-service-reporting-rail3" d="M 355 360 C 480 385, 620 420, 780 430" opacity="0.85"/>
  </g>
  <use xlink:href="#pulse" transform="translate(560,235) scale(0.7)"/>
  <use xlink:href="#pulse" transform="translate(565,320) scale(0.7)"/>
  <use xlink:href="#pulse" transform="translate(560,404) scale(0.7)"/>

  <!-- report nozzle: page with folded corner -->
  <path d="M 785 198 H 811 L 819 206 V 228 H 785 Z" fill="#050608" stroke="#f8fafc" stroke-width="1.1"/>
  <path d="M 811 198 V 206 H 819" fill="none" stroke="#f8fafc" stroke-width="0.8" opacity="0.6"/>
  <g stroke="#62748e" stroke-width="1" opacity="0.8">
    <line x1="791" y1="214" x2="809" y2="214"/>
    <line x1="791" y1="221" x2="813" y2="221"/>
  </g>
  <text x="827" y="217" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#90a1b9">report</text>

  <!-- parts nozzle: hex fitting -->
  <path d="M 817 320 L 809.5 333 L 794.5 333 L 787 320 L 794.5 307 L 809.5 307 Z" fill="#050608" stroke="#f8fafc" stroke-width="1.1"/>
  <path d="M 802 314 V 326 M 796 320 H 808" stroke="#62748e" stroke-width="1" opacity="0.8"/>
  <text x="827" y="325" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#90a1b9">parts</text>

  <!-- invoice nozzle: receipt with torn edge -->
  <path d="M 785 415 H 819 V 434 L 814 439 L 809 434 L 804 439 L 799 434 L 794 439 L 789 434 L 785 439 Z" fill="#050608" stroke="#f8fafc" stroke-width="1.1"/>
  <g stroke="#62748e" stroke-width="1" opacity="0.8">
    <line x1="791" y1="423" x2="813" y2="423"/>
    <line x1="791" y1="429" x2="807" y2="429"/>
  </g>
  <text x="827" y="432" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#90a1b9">invoice</text>

  <!-- rails converge on the confirm node -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.1">
    <path id="field-service-reporting-conv1" d="M 820 213 C 870 222, 910 260, 936 300" opacity="0.85"/>
    <path id="field-service-reporting-conv2" d="M 818 320 L 926 320" opacity="0.85"/>
    <path id="field-service-reporting-conv3" d="M 820 428 C 870 420, 910 380, 936 340" opacity="0.85"/>
  </g>
  <use xlink:href="#pulse" transform="translate(887,245) scale(0.6)"/>
  <use xlink:href="#pulse" transform="translate(887,395) scale(0.6)"/>

  <!-- lime-ringed node: one-tap confirm -->
  <circle cx="950" cy="320" r="24" fill="none" stroke="#bbf451" stroke-width="1.6" filter="url(#glow)" opacity="0.7"/>
  <circle class="field-service-reporting-pulse" cx="950" cy="320" r="24" fill="none" stroke="#bbf451" stroke-width="1.6" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;0.55;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="320" r="24" fill="none" stroke="#bbf451" stroke-width="1.6"/>
  <circle cx="950" cy="320" r="15" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.75"/>
  <path d="M 942 321 L 948 327 L 960 312" fill="none" stroke="#d8f999" stroke-width="1.6"/>
  <text x="950" y="372" text-anchor="middle" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#90a1b9">confirm</text>

  <!-- exits, released to the field-service system -->
  <path id="field-service-reporting-exit" d="M 974 320 C 1010 320, 1030 320, 1055 320" stroke="#f8fafc" stroke-width="1.2" fill="none"/>
  <use xlink:href="#swoosh" transform="translate(1015,320)"/>
  <g stroke="#f8fafc" fill="none" stroke-width="1.1" opacity="0.8">
    <path id="field-service-reporting-fan1" d="M 1075 320 C 1095 320, 1100 306, 1120 302"/>
    <path id="field-service-reporting-fan2" d="M 1075 320 L 1120 320"/>
    <path id="field-service-reporting-fan3" d="M 1075 320 C 1095 320, 1100 334, 1120 338"/>
  </g>
  <g stroke="#f8fafc" stroke-width="1.2" opacity="0.6">
    <path d="M 1120 298 v 8"/>
    <path d="M 1120 316 v 8"/>
    <path d="M 1120 334 v 8"/>
  </g>

  <!-- ==== motion: travelling pulses on the existing flow paths, 6s seamless loop ====
       Stagger uses negative begin offsets so every dot is already mid-path at t=0:
       state at t=6s is identical to t=0s, with no dot parked off-path. -->

  <!-- the technician talks; it enters the structuring comb -->
  <use class="field-service-reporting-pulse" xlink:href="#pulse" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-1.6s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1;1"><mpath href="#field-service-reporting-in" xlink:href="#field-service-reporting-in"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="-1.6s" values="0;1;1;0;0" keyTimes="0;0.02;0.085;0.12;1"/>
  </use>

  <!-- report, parts and invoice separate onto their own rails -->
  <use class="field-service-reporting-pulse" xlink:href="#pulse">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-1.5s"><mpath href="#field-service-reporting-rail1" xlink:href="#field-service-reporting-rail1"/></animateMotion>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-4.5s"><mpath href="#field-service-reporting-rail1" xlink:href="#field-service-reporting-rail1"/></animateMotion>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-2s"><mpath href="#field-service-reporting-rail2" xlink:href="#field-service-reporting-rail2"/></animateMotion>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-5s"><mpath href="#field-service-reporting-rail2" xlink:href="#field-service-reporting-rail2"/></animateMotion>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-4s"><mpath href="#field-service-reporting-rail3" xlink:href="#field-service-reporting-rail3"/></animateMotion>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-1s"><mpath href="#field-service-reporting-rail3" xlink:href="#field-service-reporting-rail3"/></animateMotion>
  </use>

  <!-- all three arrive at the confirm node and WAIT for the morning tap -->
  <use class="field-service-reporting-pulse" xlink:href="#pulse" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-0.5s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"><mpath href="#field-service-reporting-conv1" xlink:href="#field-service-reporting-conv1"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="-0.5s" values="0;1;1;1;0" keyTimes="0;0.04;0.3;0.78;1"/>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-3.5s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"><mpath href="#field-service-reporting-conv3" xlink:href="#field-service-reporting-conv3"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="-3.5s" values="0;1;1;1;0" keyTimes="0;0.04;0.3;0.78;1"/>
  </use>
  <!-- THE EXCEPTION: an ambiguous part reference arrives first and then sits there for
       almost the whole loop. A flagged field waits for the technician; it never guesses. -->
  <use class="field-service-reporting-pulse" xlink:href="#pulse" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="0s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.18;1"><mpath href="#field-service-reporting-conv2" xlink:href="#field-service-reporting-conv2"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="0s" values="0;1;1;1;0" keyTimes="0;0.03;0.18;0.93;1"/>
  </use>

  <!-- confirmed, and released to the field-service system -->
  <use class="field-service-reporting-pulse" xlink:href="#pulse">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-1.2s"><mpath href="#field-service-reporting-exit" xlink:href="#field-service-reporting-exit"/></animateMotion>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-2.4s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1;1"><mpath href="#field-service-reporting-fan1" xlink:href="#field-service-reporting-fan1"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="-2.4s" values="0;1;1;0;0" keyTimes="0;0.02;0.085;0.12;1"/>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-3.4s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1;1"><mpath href="#field-service-reporting-fan2" xlink:href="#field-service-reporting-fan2"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="-3.4s" values="0;1;1;0;0" keyTimes="0;0.02;0.085;0.12;1"/>
  </use>
  <use class="field-service-reporting-pulse" xlink:href="#pulse" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="-4.4s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1;1"><mpath href="#field-service-reporting-fan3" xlink:href="#field-service-reporting-fan3"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="-4.4s" values="0;1;1;0;0" keyTimes="0;0.02;0.085;0.12;1"/>
  </use>
</svg>
