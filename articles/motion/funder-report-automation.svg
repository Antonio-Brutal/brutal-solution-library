<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" role="img" aria-label="Engineering schematic: programme, finance and field-note strands meet a comparator whose flagged discrepancy is held in a side loop rather than dissolved, a comb snaps loose notes into evenly spaced ticks, a manifold fans the merged flow into four unequal funder channels with one isometric enclosure, and a wide ribbon of narrative rules drops tethers to source tiles before a balance interlock and a lime-ringed programme-lead gate release one clean line to the funder">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) { .funder-report-automation-pulse { display: none; } }
    </style>
    <radialGradient id="funder-report-automation-vig" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020618"/>
    </radialGradient>
    <filter id="funder-report-automation-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="funder-report-automation-pulse">
      <circle r="5.5" fill="#bbf451" opacity="0.8" filter="url(#funder-report-automation-glow)"/>
      <circle r="2" fill="#d8f999"/>
    </g>
    <g id="funder-report-automation-pulseDeep">
      <circle r="6.5" fill="#9de500" opacity="0.85" filter="url(#funder-report-automation-glow)"/>
      <circle r="2.4" fill="#d8f999"/>
    </g>
    <g id="funder-report-automation-swoosh">
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451" filter="url(#funder-report-automation-glow)" opacity="0.7"/>
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#funder-report-automation-vig)"/>

  <!-- inputs: programme records, finance ledger, field notes -->
  <g stroke="#f8fafc" fill="none" stroke-width="1">
    <path id="funder-report-automation-prog1" d="M -10 112 C 80 118, 140 132, 210 146" opacity="0.65"/>
    <path id="funder-report-automation-prog2" d="M -10 144 C 84 150, 142 150, 210 152" opacity="0.85"/>
    <path d="M -10 176 C 80 182, 140 166, 210 158" opacity="0.5"/>
    <path id="funder-report-automation-fin1" d="M -10 246 C 82 252, 142 262, 210 266" opacity="0.5"/>
    <path id="funder-report-automation-fin2" d="M -10 278 C 86 282, 144 274, 210 272" opacity="0.85"/>
    <path d="M -10 310 C 82 314, 142 288, 210 278" opacity="0.65"/>
    <path id="funder-report-automation-note1" d="M -10 396 C 60 386, 96 414, 150 400 C 206 386, 268 412, 344 398" opacity="0.7"/>
    <path d="M -10 432 C 60 444, 96 416, 150 430 C 206 444, 272 420, 344 414" opacity="0.5"/>
    <path id="funder-report-automation-note2" d="M -10 468 C 60 456, 98 484, 152 468 C 206 452, 272 444, 344 430" opacity="0.8"/>
    <path d="M -10 504 C 62 514, 100 486, 154 500 C 208 514, 274 456, 344 446" opacity="0.55"/>
  </g>
  <use xlink:href="#funder-report-automation-pulse" transform="translate(108,126)"/>
  <use xlink:href="#funder-report-automation-pulse" transform="translate(111,277)"/>
  <use xlink:href="#funder-report-automation-pulse" transform="translate(109,299)"/>
  <use xlink:href="#funder-report-automation-pulse" transform="translate(76,400)"/>
  <use xlink:href="#funder-report-automation-pulse" transform="translate(241,448)"/>

  <!-- comparator: two sources converge on a junction, the discrepancy is held in a side loop -->
  <g stroke="#f8fafc" fill="none">
    <path id="funder-report-automation-cmp1" d="M 212 150 C 268 156, 302 176, 330 204" stroke-width="1.2"/>
    <path id="funder-report-automation-cmp2" d="M 212 272 C 268 266, 302 246, 330 220" stroke-width="1.2"/>
    <path d="M 253 168 L 261 150" stroke-width="1" opacity="0.6"/>
    <path d="M 277 178 L 286 160" stroke-width="1" opacity="0.6"/>
    <path d="M 253 254 L 261 272" stroke-width="1" opacity="0.6"/>
    <path d="M 277 245 L 286 263" stroke-width="1" opacity="0.6"/>
    <path d="M 342 200 l 12 12 -12 12 -12 -12 z" stroke-width="1.2"/>
    <path id="funder-report-automation-drop" d="M 342 226 L 342 246" stroke-width="1" opacity="0.8"/>
    <circle cx="328" cy="262" r="17" stroke-width="1.1" opacity="0.9"/>
    <path id="funder-report-automation-rejoin" d="M 341 274 C 358 274, 372 246, 384 220" stroke-width="1" opacity="0.7"/>
    <path id="funder-report-automation-spine1" d="M 356 212 L 470 212" stroke-width="1.3"/>
    <path id="funder-report-automation-spine2" d="M 470 212 C 512 212, 522 262, 562 296" stroke-width="1.3"/>
  </g>
  <use xlink:href="#funder-report-automation-pulseDeep" transform="translate(328,245)"/>

