<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" role="img" aria-label="Engineering schematic: supplier documents enter a collection funnel whose mouth is a ring of hinged shutters, two closed with their lines missing and a chase loop returning to the left edge; each line splits into four filaments crossing a cross-hatched validation grid with caliper clamps and one pair held apart, while bank details leave the flow through a separate out-of-band verification ring; a dense sieve comb catches three filaments that rise on raised tracks to a single large lime-ringed analyst node, after which everything binds into one cable terminating in an isometric stack of folded plates">
  <defs>
    <radialGradient id="supplier-onboarding-risk-vig" cx="50%" cy="44%" r="78%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020618"/>
    </radialGradient>
    <filter id="supplier-onboarding-risk-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="supplier-onboarding-risk-glowBig" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="supplier-onboarding-risk-pulse">
      <circle r="5.5" fill="#bbf451" opacity="0.8" filter="url(#supplier-onboarding-risk-glow)"/>
      <circle r="2" fill="#d8f999"/>
    </g>
    <g id="supplier-onboarding-risk-pulseSmall">
      <circle r="4" fill="#bbf451" opacity="0.7" filter="url(#supplier-onboarding-risk-glow)"/>
      <circle r="1.5" fill="#d8f999"/>
    </g>
    <g id="supplier-onboarding-risk-swoosh">
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451" filter="url(#supplier-onboarding-risk-glow)" opacity="0.7"/>
      <path d="M -22 -6 Q 8 -10 22 0 Q 8 10 -22 6 Q -8 0 -22 -6 Z" fill="#bbf451"/>
    </g>
    <style>
      @media (prefers-reduced-motion: reduce) { .supplier-onboarding-risk-pulse { display: none; } }
    </style>
    <g id="supplier-onboarding-risk-mover">
      <circle r="4.6" fill="#bbf451" opacity="0.85" filter="url(#supplier-onboarding-risk-glow)"/>
      <circle r="1.7" fill="#d8f999"/>
    </g>
    <g id="supplier-onboarding-risk-moverDeep">
      <circle r="5.0" fill="#9de500" opacity="0.9" filter="url(#supplier-onboarding-risk-glow)"/>
      <circle r="1.9" fill="#d8f999"/>
    </g>
    <g id="supplier-onboarding-risk-moverSmall">
      <circle r="3.4" fill="#bbf451" opacity="0.75" filter="url(#supplier-onboarding-risk-glow)"/>
      <circle r="1.3" fill="#d8f999"/>
    </g>
    <!-- motion tracks: each traces drawn line-work already in the artwork -->
    <g id="supplier-onboarding-risk-tracks" fill="none" stroke="none">
      <path id="supplier-onboarding-risk-mA" d="M -10 306 C 60 306, 130 308, 194 310 L 274 310 L 306 310 C 330 310, 336 370, 352 400 C 368 400, 372 392, 386 392 C 412 392, 428 398, 448 398 C 466 398, 478 392, 500 392 L 640 392"/>
      <path id="supplier-onboarding-risk-mB" d="M -10 200 C 60 206, 130 222, 194 232 L 200 218 C 240 240, 262 288, 274 310 L 306 310 C 330 310, 336 250, 352 224 C 368 224, 372 216, 386 216 C 408 216, 416 222, 428 222 C 440 222, 448 216, 476 216 L 610 216"/>
      <path id="supplier-onboarding-risk-mF" d="M 948 202 C 980 236, 996 286, 998 314 L 998 335 L 1050 335"/>
      <path id="supplier-onboarding-risk-mG" d="M 670 292 H 830 C 880 292, 896 340, 940 340 L 1050 340"/>
      <path id="supplier-onboarding-risk-mH" d="M -10 254 C 40 256, 90 262, 138 266"/>
      <path id="supplier-onboarding-risk-mI" d="M 394 200 C 402 172, 404 148, 418 132 L 458 128 C 496 132, 510 170, 524 190 C 534 198, 544 200, 556 200"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#supplier-onboarding-risk-vig)"/>

  <!-- faint registration marks -->
  <g stroke="#62748e" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 336 108 h 12 M 342 102 v 12"/>
    <path d="M 1112 528 h 12 M 1118 522 v 12"/>
  </g>

  <!-- layer 1: documents arriving, two requests still outstanding -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.1">
    <path d="M -10 200 C 60 206, 130 222, 194 232" opacity="0.8"/>
    <path d="M -10 306 C 60 306, 130 308, 194 310" opacity="0.85"/>
    <path d="M -10 412 C 60 406, 130 396, 194 388" opacity="0.75"/>
  </g>
  <path d="M -10 254 C 40 256, 90 262, 138 266 M -10 356 C 40 354, 90 348, 138 344" stroke="#62748e" stroke-width="1" stroke-dasharray="4 5" opacity="0.65" fill="none"/>
  <path d="M 140 258 v 16 M 140 336 v 16" stroke="#62748e" stroke-width="1.2" opacity="0.7" fill="none"/>
  <use xlink:href="#supplier-onboarding-risk-pulse" transform="translate(80,206)"/>
  <use xlink:href="#supplier-onboarding-risk-pulse" transform="translate(104,307)"/>
  <use xlink:href="#supplier-onboarding-risk-pulse" transform="translate(64,406)"/>
  <text x="30" y="150" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#90a1b9">supplier documents</text>

  <!-- collection funnel with a ring of hinged shutters -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.2">
    <ellipse cx="200" cy="310" rx="10" ry="92" opacity="0.8"/>
    <path d="M 196 232 L 172 214 M 196 310 L 168 300 M 196 388 L 172 404"/>
    <path d="M 191 256 L 209 276 M 191 342 L 209 362" opacity="0.7"/>
    <path d="M 200 218 C 240 240, 262 288, 274 310 M 200 402 C 240 380, 262 332, 274 310" stroke-width="1.3"/>
    <path d="M 204 248 C 236 268, 252 296, 268 308 M 204 372 C 236 352, 252 324, 268 312" stroke-width="0.9" opacity="0.4"/>
    <ellipse cx="278" cy="310" rx="3.5" ry="9" stroke-width="1.1" opacity="0.85"/>
    <path d="M 282 310 H 306" stroke-width="1.3"/>
  </g>
  <path d="M 196 232 h 0.5 M 196 310 h 0.5 M 196 388 h 0.5 M 195 256 h 0.5 M 195 342 h 0.5" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <use xlink:href="#supplier-onboarding-risk-swoosh" transform="translate(142,308)"/>

  <!-- automated chase loop back to the supplier, and a rail of documents already held -->
  <g stroke="#f8fafc" fill="none" stroke-width="0.9" opacity="0.5">
    <path id="supplier-onboarding-risk-chase" d="M 262 344 C 214 448, 116 480, 54 434"/>
    <path d="M 54 434 l 14 0 M 54 434 l 4 13"/>
    <path d="M 150 462 v 10 M 196 432 v 10 M 104 452 v 10"/>
  </g>
  <g stroke="#f8fafc" fill="none" stroke-width="0.9" opacity="0.5">
    <rect x="44" y="492" width="50" height="11"/>
    <rect x="50" y="507" width="50" height="11"/>
    <rect x="56" y="522" width="50" height="11"/>
    <path d="M 106 512 C 152 508, 174 456, 198 412"/>
  </g>

  <!-- layer 2: each line splits into four filaments across a validation grid -->
  <g stroke="#62748e" fill="none" stroke-width="0.8" opacity="0.26">
    <path d="M 396 176 L 524 304 M 396 224 L 524 352 M 396 272 L 524 400 M 396 320 L 524 448 M 444 176 L 524 256 M 492 176 L 524 208 M 396 368 L 476 448 M 396 416 L 428 448"/>
    <path d="M 396 448 L 524 320 M 396 400 L 524 272 M 396 352 L 524 224 M 396 304 L 524 176 M 444 448 L 524 368 M 492 448 L 524 416 M 396 256 L 476 176 M 396 208 L 428 176"/>
  </g>
  <g stroke="#f8fafc" fill="none" stroke-width="1" opacity="0.6">
    <path d="M 306 310 C 330 310, 336 250, 352 224"/>
    <path d="M 306 310 H 352"/>
    <path d="M 306 310 C 330 310, 336 370, 352 400"/>
  </g>
  <g stroke="#f8fafc" fill="none" stroke-width="0.9">
    <path d="M 352 224 C 368 224, 372 200, 386 200 H 670" opacity="0.7"/>
    <path d="M 352 224 C 368 224, 372 216, 386 216 C 408 216, 416 222, 428 222 C 440 222, 448 216, 476 216 H 610" opacity="0.95"/>
    <path d="M 352 224 C 368 224, 372 232, 386 232 C 408 232, 416 226, 428 226 C 440 226, 448 232, 476 232 H 670" opacity="0.9"/>
    <path d="M 352 224 C 368 224, 372 248, 386 248 H 670" opacity="0.65"/>
    <path d="M 352 312 C 368 312, 372 288, 386 288 H 670" opacity="0.7"/>
    <path d="M 352 312 C 368 312, 372 304, 386 304 C 430 304, 452 304, 470 296 C 486 290, 500 290, 520 292 H 670" opacity="0.95"/>
    <path d="M 352 312 C 368 312, 372 320, 386 320 C 430 320, 452 320, 470 328 C 486 334, 500 334, 520 334 H 584" opacity="0.95"/>
    <path d="M 352 312 C 368 312, 372 336, 386 336 H 670" opacity="0.65"/>
    <path d="M 352 400 C 368 400, 372 376, 386 376 H 670" opacity="0.7"/>
    <path d="M 352 400 C 368 400, 372 392, 386 392 C 412 392, 428 398, 448 398 C 466 398, 478 392, 500 392 H 640" opacity="0.95"/>
    <path d="M 352 400 C 368 400, 372 408, 386 408 C 412 408, 428 402, 448 402 C 466 402, 478 408, 500 408 H 670" opacity="0.9"/>
    <path d="M 352 400 C 368 400, 372 424, 386 424 H 670" opacity="0.65"/>
  </g>
  <path d="M 404 196 v 8 M 452 244 v 8 M 418 284 v 8 M 466 332 v 8 M 410 372 v 8 M 458 420 v 8 M 486 196 v 8 M 496 244 v 8 M 500 284 v 8 M 434 372 v 8 M 440 420 v 8 M 476 284 v 8" stroke="#f8fafc" stroke-width="0.8" opacity="0.4" fill="none"/>
  <!-- calipers clamp matching filaments; one pair is held apart -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.1">
    <path d="M 420 204 L 428 214 L 436 204 M 420 244 L 428 234 L 436 244"/>
    <path d="M 440 380 L 448 390 L 456 380 M 440 420 L 448 410 L 456 420"/>
    <path d="M 494 302 h 14 M 494 324 h 14 M 501 302 v 6 M 501 324 v -6" opacity="0.8"/>
  </g>
  <use xlink:href="#supplier-onboarding-risk-pulseSmall" transform="translate(470,248)"/>
  <use xlink:href="#supplier-onboarding-risk-pulseSmall" transform="translate(548,336)"/>
  <use xlink:href="#supplier-onboarding-risk-pulseSmall" transform="translate(516,424)"/>

  <!-- bank details: a heavier line leaving the flow for out-of-band verification -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.6">
    <path d="M 394 200 C 402 172, 404 148, 418 132"/>
    <path d="M 458 128 C 496 132, 510 170, 524 190 C 534 198, 544 200, 556 200"/>
    <circle cx="438" cy="128" r="20" stroke-width="1.4"/>
  </g>
  <path d="M 426 128 h 24 M 438 116 v 24" stroke="#f8fafc" stroke-width="0.9" opacity="0.4" fill="none"/>
  <text x="468" y="106" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#90a1b9">out of band</text>

  <!-- layer 3: the screening sieve -->
  <g stroke="#f8fafc" fill="none">
    <path d="M 552 158 H 664 M 552 460 H 664" stroke-width="1.2" opacity="0.7"/>
    <path d="M 556 158 V 460 M 563 158 V 460 M 570 158 V 460 M 577 158 V 460 M 584 158 V 460 M 591 158 V 460 M 598 158 V 460 M 605 158 V 460 M 612 158 V 460 M 619 158 V 460 M 626 158 V 460 M 633 158 V 460 M 640 158 V 460 M 647 158 V 460 M 654 158 V 460 M 661 158 V 460" stroke-width="0.9" opacity="0.3"/>
    <path d="M 584 158 V 460 M 610 158 V 460 M 640 158 V 460" stroke-width="1" opacity="0.6"/>
  </g>
  <use xlink:href="#supplier-onboarding-risk-pulse" transform="translate(610,216)"/>
  <use xlink:href="#supplier-onboarding-risk-pulse" transform="translate(584,334)"/>
  <use xlink:href="#supplier-onboarding-risk-pulse" transform="translate(640,392)"/>

  <!-- caught filaments lifted onto raised tracks, each with a dated list tick -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.2">
    <path id="supplier-onboarding-risk-caught1" d="M 610 216 C 690 210, 786 172, 890 176"/>
    <path d="M 584 334 C 700 332, 800 226, 892 192"/>
    <path id="supplier-onboarding-risk-caught2" d="M 640 392 C 730 388, 824 250, 890 204"/>
    <path d="M 712 188 v 12 M 706 200 h 12 M 800 234 v 12 M 794 246 h 12 M 770 310 v 12 M 764 322 h 12" stroke-width="0.9" opacity="0.55"/>
  </g>
  <use xlink:href="#supplier-onboarding-risk-pulseSmall" transform="translate(788,196)"/>
  <use xlink:href="#supplier-onboarding-risk-pulseSmall" transform="translate(848,238)"/>

  <!-- clean filaments recombining into one bound cable -->
  <g stroke="#f8fafc" fill="none" stroke-width="0.9" opacity="0.8">
    <path d="M 670 200 H 830 C 880 200, 896 320, 940 320"/>
    <path d="M 670 232 H 830 C 880 232, 896 325, 940 325"/>
    <path d="M 670 248 H 830 C 880 248, 896 330, 940 330"/>
    <path d="M 670 288 H 830 C 880 288, 896 335, 940 335"/>
    <path d="M 670 292 H 830 C 880 292, 896 340, 940 340"/>
    <path d="M 670 336 H 830 C 880 336, 896 345, 940 345"/>
    <path d="M 670 376 H 830 C 880 376, 896 350, 940 350"/>
    <path d="M 670 408 H 830 C 880 408, 896 355, 940 355"/>
    <path d="M 670 424 H 830 C 880 424, 896 360, 940 360"/>
  </g>
  <path d="M 940 320 H 1050 M 940 325 H 1050 M 940 330 H 1050 M 940 335 H 1050 M 940 340 H 1050 M 940 345 H 1050 M 940 350 H 1050 M 940 355 H 1050 M 940 360 H 1050" stroke="#f8fafc" stroke-width="0.9" opacity="0.8" fill="none"/>
  <path d="M 968 312 v 56 M 996 312 v 56 M 1024 312 v 56" stroke="#f8fafc" stroke-width="1.1" opacity="0.6" fill="none"/>
  <use xlink:href="#supplier-onboarding-risk-swoosh" transform="translate(1012,340)"/>

  <!-- layer 4: the analyst's ring, the one opening every caught filament must pass -->
  <g stroke="#90a1b9" fill="none" stroke-width="1" opacity="0.75">
    <path d="M 924 144 V 110"/>
    <circle cx="924" cy="104" r="6"/>
  </g>
  <circle cx="924" cy="178" r="34" fill="none" stroke="#bbf451" stroke-width="2" filter="url(#supplier-onboarding-risk-glowBig)" opacity="0.75"/>
  <circle cx="924" cy="178" r="34" fill="none" stroke="#bbf451" stroke-width="2"/>
  <circle cx="924" cy="178" r="21" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.7"/>
  <circle cx="924" cy="178" r="4" fill="#d8f999"/>
  <path d="M 948 202 C 980 236, 996 286, 998 314" stroke="#f8fafc" stroke-width="1.2" fill="none" opacity="0.85"/>
  <text x="972" y="152" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#90a1b9">analyst decides</text>

  <!-- the assembled risk file: an extruded stack of folded plates -->
  <g stroke="#f8fafc" fill="none" stroke-width="1.1">
    <rect x="1050" y="300" width="88" height="9"/>
    <rect x="1050" y="318" width="88" height="9"/>
    <rect x="1050" y="336" width="88" height="9"/>
    <rect x="1050" y="354" width="88" height="9"/>
    <rect x="1050" y="372" width="88" height="9"/>
    <path d="M 1050 300 L 1062 291 L 1150 291 L 1138 300 Z"/>
    <path d="M 1138 309 L 1150 300 M 1138 327 L 1150 318 M 1138 345 L 1150 336 M 1138 363 L 1150 354 M 1138 381 L 1150 372 M 1150 291 V 372" stroke-width="0.9" opacity="0.5"/>
    <path d="M 1124 300 L 1138 309 M 1124 318 L 1138 327 M 1124 336 L 1138 345 M 1124 354 L 1138 363 M 1124 372 L 1138 381" stroke-width="0.8" opacity="0.35"/>
  </g>
  <text x="1052" y="264" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#90a1b9">risk file</text>

  <!-- rescreening on a schedule -->
  <path d="M 1094 386 C 1060 470, 860 500, 700 478 C 668 474, 648 466, 640 458" stroke="#62748e" stroke-width="1" stroke-dasharray="5 7" opacity="0.45" fill="none"/>

  <!-- stage labels -->
  <g stroke="#62748e" stroke-width="1" stroke-dasharray="2 5" opacity="0.45" fill="none">
    <path d="M 450 470 V 546"/>
    <path d="M 620 486 V 546"/>
  </g>
  <g font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#f8fafc" text-anchor="middle">
    <text x="450" y="568">validation</text>
    <text x="620" y="568">screening</text>
  </g>
  <!-- ==== motion (MOTION-SPEC.md): 6s seamless loop, additive only ==== -->
  <g id="supplier-onboarding-risk-motion">
    <circle class="supplier-onboarding-risk-pulse" cx="924" cy="178" r="34" fill="none" stroke="#bbf451"
            stroke-width="2" filter="url(#supplier-onboarding-risk-glowBig)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-mover">
      <animateMotion dur="6s" begin="-0.4s" repeatCount="indefinite">
        <mpath xlink:href="#supplier-onboarding-risk-mA"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-0.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.9;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-mover">
      <animateMotion dur="6s" begin="-2.5s" repeatCount="indefinite">
        <mpath xlink:href="#supplier-onboarding-risk-mB"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-2.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.9;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-mover">
      <animateMotion dur="6s" begin="-4.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.42;1">
        <mpath xlink:href="#supplier-onboarding-risk-caught1"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-4.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.42;0.58;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-mover">
      <animateMotion dur="6s" begin="-1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.42;1">
        <mpath xlink:href="#supplier-onboarding-risk-caught2"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-1.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.42;0.58;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-mover">
      <animateMotion dur="6s" begin="-3.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;0.45;1">
        <mpath xlink:href="#supplier-onboarding-risk-mF"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-3.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.9;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-mover">
      <animateMotion dur="6s" begin="-0.9s" repeatCount="indefinite">
        <mpath xlink:href="#supplier-onboarding-risk-mG"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-0.9s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.9;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-moverSmall">
      <animateMotion dur="6s" begin="-5.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.45;1">
        <mpath xlink:href="#supplier-onboarding-risk-mH"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-5.2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.45;0.61;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-moverDeep">
      <animateMotion dur="6s" begin="-2.9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.45;0.45;1" keyTimes="0;0.34;0.62;1">
        <mpath xlink:href="#supplier-onboarding-risk-mI"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-2.9s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.9;1"/>
    </use>
    <use class="supplier-onboarding-risk-pulse" xlink:href="#supplier-onboarding-risk-moverSmall">
      <animateMotion dur="6s" begin="-4s" repeatCount="indefinite">
        <mpath xlink:href="#supplier-onboarding-risk-chase"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" begin="-4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.9;1"/>
    </use>
  </g>
</svg>
